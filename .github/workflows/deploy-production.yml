name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dfws-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          node --check server.mjs
          node --check api/staff/delete-skill-resource.js
          node --check api/staff/invite-member.js
          node --check api/staff/send-password-setup-email.js
          node --check api/staff/send-skill-review-email.js

      - name: Package application files
        uses: actions/upload-artifact@v4
        with:
          name: dfws-release
          if-no-files-found: error
          path: |
            ./
            !.git/**
            !.github/**
            !.vercel/**
            !deploy/**
            !migrations/**
            !README.md
            !伙伴端产品说明书.md

  deploy:
    name: Deploy to Tencent Cloud
    needs: build
    runs-on: [self-hosted, Linux, X64, dfws-production]
    timeout-minutes: 10

    steps:
      - name: Download validated release
        uses: actions/download-artifact@v4
        with:
          name: dfws-release
          path: release

      - name: Synchronize application files
        run: |
          sudo -n install -d -o ubuntu -g ubuntu /opt/dfws
          sudo -n rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.vercel/' \
            --exclude 'deploy/' \
            --exclude 'migrations/' \
            --exclude 'README.md' \
            --exclude '伙伴端产品说明书.md' \
            "$GITHUB_WORKSPACE/release/" /opt/dfws/

      - name: Configure review email SMTP
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          test -n "$SMTP_PASSWORD"
          smtp_env=$(mktemp)
          sudo -n cat /etc/dfws.env 2>/dev/null | grep -v -E '^SMTP_(HOST|PORT|SECURE|USER|FROM|PASSWORD)=' > "$smtp_env" || true
          {
            cat "$smtp_env"
            printf '%s\n' 'SMTP_HOST=smtp.qiye.aliyun.com'
            printf '%s\n' 'SMTP_PORT=465'
            printf '%s\n' 'SMTP_SECURE=true'
            printf '%s\n' 'SMTP_USER=skill@dfwsgroup.com'
            printf '%s\n' 'SMTP_FROM=skill@dfwsgroup.com'
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
          } | sudo -n tee /etc/dfws.env > /dev/null
          sudo -n chmod 600 /etc/dfws.env

      - name: Restart and verify service
        run: |
          sudo -n systemctl restart dfws
          systemctl is-active --quiet dfws
          curl --fail --retry 6 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:3000/_health
          timeout 10 bash -c '</dev/tcp/smtp.qiye.aliyun.com/465'
